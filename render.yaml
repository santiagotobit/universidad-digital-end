# Blueprint de Render para la API FastAPI.
# La base de datos PostgreSQL está alojada en Supabase.

services:
  - type: web
    name: universidad-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /docs

    envVars:
      - key: APP_ENV
        value: production

      - key: APP_DATABASE_URL
        sync: false

      - key: APP_DATABASE_SSL_MODE
        value: require

      - key: APP_JWT_SECRET
        generateValue: true

      - key: APP_COOKIE_SECURE
        value: "true"

      - key: APP_COOKIE_SAMESITE
        value: "none"

      - key: APP_CORS_ORIGINS
        sync: false